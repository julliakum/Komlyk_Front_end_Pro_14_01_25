<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Онлайн-кафе</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-dark text-white">
    <div class="container py-4">
      <!-- Категорії -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div id="categories" class="btn-group flex-wrap"></div>
        <button
          class="btn btn-warning position-relative"
          onclick="toggleCart()"
        >
          🛒 Кошик
          <span
            id="cart-count"
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-dark text-white"
            >0</span
          >
        </button>
      </div>

      <!-- Назва категорії -->
      <h2 id="category-title">Оберіть категорію</h2>

      <!-- Товари -->
      <div id="products" class="row mt-4 g-4"></div>

      <!-- Кошик -->
      <div id="cart" class="bg-light text-dark p-4 rounded mt-4 d-none">
        <h4>Ваше замовлення</h4>
        <div id="cart-items"></div>
        <div class="d-flex justify-content-between mt-3">
          <strong>Загальна сума:</strong>
          <span id="cart-total">0 ₴</span>
        </div>
        <hr />
        <button class="btn btn-success w-100" onclick="submitOrder()">
          Замовити
        </button>
      </div>
    </div>

    <!-- Модальне вікно -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle"></h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="row">
              <div class="col-md-6 text-center">
                <img id="modalImage" src="" alt="" class="img-fluid rounded" />
              </div>
              <div class="col-md-6">
                <p id="modalDescription"></p>
                <p id="modalPrice"></p>
                <p id="modalWeight"></p>
                <form id="editForm">
                  <div class="mb-3">
                    <label class="form-label">Інгредієнти:</label>
                    <div id="ingredientsContainer" class="form-check"></div>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Додатково:</label>
                    <div id="saucesContainer" class="form-check"></div>
                  </div>
                  <div
                    class="mb-3 d-flex align-items-center justify-content-start gap-3"
                  >
                    <label for="quantityInput" class="form-label m-0"
                      >Кількість</label
                    >
                    <button
                      type="button"
                      class="btn btn-outline-warning"
                      onclick="changeQuantity(-1)"
                    >
                      −
                    </button>
                    <input
                      type="number"
                      id="quantityInput"
                      class="form-control w-25 text-center"
                      value="1"
                      min="1"
                    />
                    <button
                      type="button"
                      class="btn btn-outline-warning"
                      onclick="changeQuantity(1)"
                    >
                      +
                    </button>
                  </div>
                  <button type="submit" class="btn btn-cart w-100">
                    <i class="bi bi-cart-plus"></i> Додати в кошик
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
