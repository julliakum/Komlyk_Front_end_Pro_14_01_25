<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>HW 20</title>
    <script defer src="./script.js"></script>
  </head>
  <body>
    <h1>Vote for your favorite emoji and have fun!</h1>
    <div class="voting-container" id="voting-container">
      <div class="emoji-wrapper">
        <button class="emoji-button" data-index="0">🥹</button>
        <div class="count" id="count-0">0</div>
      </div>
      <div class="emoji-wrapper">
        <button class="emoji-button" data-index="1">😂</button>
        <div class="count" id="count-1">0</div>
      </div>
      <div class="emoji-wrapper">
        <button class="emoji-button" data-index="2">😍</button>
        <div class="count" id="count-2">0</div>
      </div>
      <div class="emoji-wrapper">
        <button class="emoji-button" data-index="3">😎</button>
        <div class="count" id="count-3">0</div>
      </div>
      <div class="emoji-wrapper">
        <button class="emoji-button" data-index="4">🫠</button>
        <div class="count" id="count-4">0</div>
      </div>
    </div>
  </body>
</html>
